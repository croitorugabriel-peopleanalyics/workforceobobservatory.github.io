name: Build and deploy Workforce Observatory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync backend-managed content
        if: ${{ secrets.BACKEND_ORIGIN != '' && secrets.BACKEND_SYNC_TOKEN != '' }}
        env:
          BACKEND_ORIGIN: ${{ secrets.BACKEND_ORIGIN }}
          BACKEND_SYNC_TOKEN: ${{ secrets.BACKEND_SYNC_TOKEN }}
        run: python scripts/sync_backend.py
      - name: Build scheduled Workforce Observatory site
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
