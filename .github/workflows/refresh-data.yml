name: Refresh public workforce data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and transform public data
        run: python scripts/fetch_data.py
      - name: Validate output
        run: python -m json.tool data/dashboard.json > /dev/null
      - name: Commit refreshed dataset
        run: |
          git config user.name "workforce-observatory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: daily public workforce refresh"
          git push
