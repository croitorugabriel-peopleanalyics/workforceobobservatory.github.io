name: Deploy Cloudflare admin backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-admin.yml"
permissions:
  contents: read
jobs:
  deploy-cloudflare-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          content = Path("cloudflare/wrangler.toml").read_text()
          content = content.replace("REPLACE_WITH_D1_DATABASE_ID", os.environ["D1_DATABASE_ID"])
          content = content.replace("REPLACE_WITH_MEDIA_BUCKET", os.environ["R2_BUCKET_NAME"])
          Path("cloudflare/.tmp-wrangler.toml").write_text(content)
          PY
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.59.1 d1 migrations apply workforce_observatory --remote --config cloudflare/.tmp-wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.59.1 deploy --config cloudflare/.tmp-wrangler.toml
